<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="수라당 떡 수량 계산기 - 파란상자 배분 최적화">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="수라당 계산기">

    <title>수라당 수량 계산기</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M25 35h50M25 50h50M25 65h50' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af',
                        accent: '#60a5fa',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.5s ease-out',
                        'fade-in': 'fadeIn 0.3s ease-in',
                        'scale-in': 'scaleIn 0.3s ease-out',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                    },
                }
            }
        }
    </script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1),
                        0 4px 6px -1px rgba(0, 0, 0, 0.1),
                        0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .result-card {
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
                        0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .number-input::-webkit-outer-spin-button,
        .number-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .number-input {
            -moz-appearance: textfield;
        }

        @keyframes pulse-border {
            0%, 100% {
                border-color: rgba(37, 99, 235, 0.5);
            }
            50% {
                border-color: rgba(37, 99, 235, 1);
            }
        }

        .calculating {
            animation: pulse-border 1.5s ease-in-out infinite;
        }

        /* iOS safe area */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(37, 99, 235, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(37, 99, 235, 0.7);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8 animate-fade-in">
            <div class="inline-block mb-4">
                <div class="w-16 h-16 bg-white rounded-2xl shadow-xl flex items-center justify-center mx-auto">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                </div>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2 drop-shadow-lg">수라당</h1>
            <p class="text-white/90 text-lg md:text-xl font-medium">떡 수량 계산기</p>
        </div>

        <!-- Main Calculator Card -->
        <div class="glass-effect rounded-3xl shadow-2xl p-6 md:p-8 mb-6 animate-scale-in">
            <!-- Input Section -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        총 떡 수량
                        <span class="text-xs font-normal text-gray-500 ml-1">(개)</span>
                    </label>
                    <div class="relative">
                        <input
                            type="number"
                            id="totalQuantity"
                            class="number-input w-full px-5 py-4 text-2xl font-semibold text-gray-800 bg-white border-2 border-gray-200 rounded-2xl focus:outline-none input-glow transition-all"
                            placeholder="예: 12000"
                            min="0"
                            step="1"
                        >
                        <div class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        파란상자 당 떡 개수
                        <span class="text-xs font-normal text-gray-500 ml-1">(개/상자)</span>
                    </label>
                    <div class="relative">
                        <input
                            type="number"
                            id="perBox"
                            class="number-input w-full px-5 py-4 text-2xl font-semibold text-gray-800 bg-white border-2 border-gray-200 rounded-2xl focus:outline-none input-glow transition-all"
                            placeholder="예: 100"
                            min="1"
                            step="1"
                        >
                        <div class="absolute right-5 top-1/2 -translate-y-1/2 text-blue-500 bg-blue-50 px-3 py-1 rounded-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        한 줄당 파란상자 개수
                        <span class="text-xs font-normal text-gray-500 ml-1">(20-23개 권장)</span>
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="block text-xs text-gray-500 mb-1 ml-1">최소</label>
                            <input
                                type="number"
                                id="minPerRow"
                                class="number-input w-full px-4 py-3 text-xl font-semibold text-gray-800 bg-white border-2 border-gray-200 rounded-xl focus:outline-none input-glow transition-all"
                                value="20"
                                min="1"
                                step="1"
                            >
                        </div>
                        <div class="relative">
                            <label class="block text-xs text-gray-500 mb-1 ml-1">최대</label>
                            <input
                                type="number"
                                id="maxPerRow"
                                class="number-input w-full px-4 py-3 text-xl font-semibold text-gray-800 bg-white border-2 border-gray-200 rounded-xl focus:outline-none input-glow transition-all"
                                value="23"
                                min="1"
                                step="1"
                            >
                        </div>
                    </div>
                </div>

                <!-- Calculate Button -->
                <button
                    id="calculateBtn"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-5 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 text-lg"
                >
                    <span class="flex items-center justify-center">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                        </svg>
                        계산하기
                    </span>
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden">
            <!-- Summary Card -->
            <div class="glass-effect rounded-3xl shadow-2xl p-6 md:p-8 mb-6 animate-slide-up">
                <div class="flex items-center mb-6">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-xl flex items-center justify-center mr-4">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">계산 결과</h2>
                </div>

                <!-- Key Metrics -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="result-card bg-gradient-to-br from-blue-50 to-blue-100 p-5 rounded-2xl border border-blue-200">
                        <div class="text-xs font-semibold text-blue-600 uppercase tracking-wide mb-1">총 상자</div>
                        <div id="totalBoxes" class="text-3xl font-bold text-blue-900">-</div>
                        <div class="text-xs text-blue-600 mt-1">개</div>
                    </div>
                    <div class="result-card bg-gradient-to-br from-purple-50 to-purple-100 p-5 rounded-2xl border border-purple-200">
                        <div class="text-xs font-semibold text-purple-600 uppercase tracking-wide mb-1">총 줄 수</div>
                        <div id="totalRows" class="text-3xl font-bold text-purple-900">-</div>
                        <div class="text-xs text-purple-600 mt-1">줄</div>
                    </div>
                    <div class="result-card bg-gradient-to-br from-green-50 to-green-100 p-5 rounded-2xl border border-green-200">
                        <div class="text-xs font-semibold text-green-600 uppercase tracking-wide mb-1">한 줄당</div>
                        <div id="boxesPerRow" class="text-3xl font-bold text-green-900">-</div>
                        <div class="text-xs text-green-600 mt-1">개</div>
                    </div>
                    <div class="result-card bg-gradient-to-br from-orange-50 to-orange-100 p-5 rounded-2xl border border-orange-200">
                        <div class="text-xs font-semibold text-orange-600 uppercase tracking-wide mb-1">마지막 줄</div>
                        <div id="lastRowBoxes" class="text-3xl font-bold text-orange-900">-</div>
                        <div class="text-xs text-orange-600 mt-1">개</div>
                    </div>
                </div>

                <!-- Detailed Breakdown -->
                <div id="detailedBreakdown" class="space-y-3">
                    <!-- Will be populated by JavaScript -->
                </div>

                <!-- Remaining Items Alert -->
                <div id="remainingAlert" class="hidden mt-6 bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-xl">
                    <div class="flex items-start">
                        <svg class="w-6 h-6 text-yellow-600 mr-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <div>
                            <div class="font-semibold text-yellow-800 mb-1">남은 떡이 있습니다</div>
                            <div class="text-yellow-700">
                                <span id="remainingItems" class="font-bold">-</span>개의 떡이 남습니다.
                                <span id="remainingSuggestion"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Visual Representation -->
            <div class="glass-effect rounded-3xl shadow-2xl p-6 md:p-8 animate-slide-up" style="animation-delay: 0.1s;">
                <h3 class="text-xl font-bold text-gray-800 mb-5 flex items-center">
                    <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z"></path>
                    </svg>
                    배치 시각화
                </h3>
                <div id="visualization" class="space-y-3 overflow-x-auto">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-white/80 text-sm animate-fade-in">
            <p>&copy; 2025 수라당. All rights reserved.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
